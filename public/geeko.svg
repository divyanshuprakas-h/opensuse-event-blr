<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- openSUSE Geeko Chameleon Vector -->
  <circle cx="80" cy="80" r="76" fill="#173f35" stroke="#73ba25" stroke-width="3" />
  <g transform="translate(20, 25) scale(0.75)">
    <!-- Body & Tail spiral -->
    <path d="M70 120 C 30 120, 10 95, 10 65 C 10 35, 45 10, 85 10 C 130 10, 150 45, 145 75 C 142 95, 125 110, 105 110 C 85 110, 80 95, 85 85 C 90 75, 102 78, 102 85 C 102 90, 95 95, 88 92" 
          stroke="#73ba25" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Crest / Spine bumps -->
    <path d="M40 25 C 45 15, 60 15, 65 20 M75 12 C 82 5, 95 8, 98 15 M110 18 C 120 12, 130 18, 133 28" 
          stroke="#8ee332" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Eye outer & inner -->
    <circle cx="125" cy="50" r="14" fill="#ffffff" stroke="#173f35" stroke-width="3"/>
    <circle cx="127" cy="50" r="7" fill="#73ba25" />
    <circle cx="129" cy="49" r="3" fill="#090e0d" />
    <!-- Smile & Tongue -->
    <path d="M135 68 C 128 75, 115 72, 110 70" stroke="#173f35" stroke-width="4" stroke-linecap="round"/>
    <path d="M138 70 Q 152 72, 155 80" stroke="#ea6621" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Feet -->
    <path d="M35 100 Q 25 115, 20 122 M55 110 Q 50 125, 48 132 M95 105 Q 100 122, 108 128" 
          stroke="#73ba25" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
